<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urdu Typing Master - ایڈمن پینل</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- نیویگیشن بار -->
    <nav class="navbar">
        <div class="logo">Urdu Typing Master - ایڈمن ڈیش بورڈ</div>
        <button onclick="logout()" style="background: #e53e3e; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">لاگ آؤٹ</button>
    </nav>

    <section style="padding: 40px 8%; display: flex; flex-direction: column; align-items: center; gap: 30px;">
        
        <!-- ۱. ڈاؤن لوڈ لنک اپڈیٹ کنٹرول -->
        <div style="background: white; padding: 30px; border-radius: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); max-width: 600px; width: 100%; text-align: right;">
            <h3 style="color: #2b6cb0; margin-bottom: 20px;">1. ڈاؤن لوڈ لنک اور فائل کنٹرول (data.json)</h3>
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">موجودہ ورژن:</label>
                <input type="text" id="admin-version" value="v1.0.0" style="width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 5px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">فائل سائز:</label>
                <input type="text" id="admin-size" value="15.4 MB" style="width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 5px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">ریلیز کی تاریخ:</label>
                <input type="text" id="admin-date" value="2026-08-10" style="width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 5px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">سافٹ ویئر کا ڈائریکٹ ڈاؤن لوڈ لنک (Google Drive / MediaFire):</label>
                <input type="text" id="admin-url" value="https://example.com/setup.exe" style="width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 5px;">
            </div>

            <button onclick="generateDataJson()" style="background: #38a169; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 15px; font-weight: bold; cursor: pointer;">نئی data.json فائل ڈاؤن لوڈ کریں</button>
        </div>

        <!-- ۲. اپڈیٹ ہسٹری کنٹرول -->
        <div style="background: white; padding: 30px; border-radius: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); max-width: 600px; width: 100%; text-align: right;">
            <h3 style="color: #2b6cb0; margin-bottom: 20px;">2. اپڈیٹس ہسٹری کنٹرول (version.json)</h3>
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">لیٹسٹ ورژن:</label>
                <input type="text" id="admin-latest-ver" value="v1.0.0" style="width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 5px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">نیا کیا ہے؟ (پوائنٹس کو کوما (,) سے الگ کریں):</label>
                <textarea id="admin-notes" style="width: 100%; height: 80px; padding: 8px; border: 1px solid #cbd5e0; border-radius: 5px;">اردو ٹائپنگ ماسٹر کا پہلا آفیشل ریلیز۔, ہارڈ ویئر آئی ڈی لائسنس سسٹم۔, فونٹک کی بورڈ لے آؤٹ۔</textarea>
            </div>

            <button onclick="generateVersionJson()" style="background: #38a169; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 15px; font-weight: bold; cursor: pointer;">نئی version.json فائل ڈاؤن لوڈ کریں</button>
        </div>

    </section>

    <script>
        // سیکورٹی چیک (اگر لاگ ان نہیں ہے تو لاگ ان پیج پر بھیج دیں)
        if (localStorage.getItem('isAdminLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }

        function logout() {
            localStorage.removeItem('isAdminLoggedIn');
            window.location.href = 'login.html';
        }

        // data.json فائل بنانے کا فنکشن
        function generateDataJson() {
            const data = {
                software_name: "Urdu Typing Master",
                current_version: document.getElementById('admin-version').value,
                release_date: document.getElementById('admin-date').value,
                file_size: document.getElementById('admin-size').value,
                download_url: document.getElementById('admin-url').value
            };
            downloadJSON(data, 'data.json');
        }

        // version.json فائل بنانے کا فنکشن
        function generateVersionJson() {
            const rawNotes = document.getElementById('admin-notes').value.split(',');
            const notes = rawNotes.map(note => note.trim());
            
            const versionData = {
                latest_version: document.getElementById('admin-latest-ver').value,
                patch_notes: notes
            };
            downloadJSON(versionData, 'version.json');
        }

        // JSON فائل کمپیوٹر میں سیو کروانے کا طریقہ
        function downloadJSON(obj, filename) {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(obj, null, 4));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", filename);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            alert(filename + " آپ کے کمپیوٹر میں ڈاؤن لوڈ ہو گئی ہے! اسے اپنے پروجیکٹ کے فولڈر میں پرانی فائل سے تبدیل کر کے نیٹ لیفائی پر اپلوڈ کریں۔");
        }
    </script>
</body>
</html>
