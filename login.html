<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urdu Typing Master - ایڈمن لاگ ان</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- نیویگیشن بار -->
    <nav class="navbar">
        <div class="logo">Urdu Typing Master</div>
        <ul class="nav-links">
            <li><a href="index.html">ہوم</a></li>
            <li><a href="downloads.html">ڈاؤن لوڈز</a></li>
            <li><a href="updates.html">اپڈیٹس</a></li>
            <li><a href="login.html" class="active">ایڈمن لاگ ان</a></li>
        </ul>
    </nav>

    <!-- لاگ ان فارم -->
    <section style="padding: 80px 8%; display: flex; justify-content: center;">
        <div style="background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); max-width: 400px; width: 100%; text-align: right;">
            <h2 style="color: #2b6cb0; text-align: center; margin-bottom: 25px;">ایڈمن لاگ ان</h2>
            
            <form id="login-form">
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: bold;">یوزر نیم (Username):</label>
                    <input type="text" id="username" style="width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 5px; outline: none; font-size: 16px;" required>
                </div>

                <div style="margin-bottom: 25px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: bold;">پاس ورڈ (Password):</label>
                    <input type="password" id="password" style="width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 5px; outline: none; font-size: 16px;" required>
                </div>

                <button type="submit" style="width: 100%; background: #2b6cb0; color: white; border: none; padding: 12px; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer;">لاگ ان کریں</button>
            </form>
            <p id="error-msg" style="color: #e53e3e; text-align: center; margin-top: 15px; display: none;">غلط یوزر نیم یا پاس ورڈ!</p>
        </div>
    </section>

    <!-- فوٹر -->
    <footer class="footer" style="position: fixed; bottom: 0; width: 100%;">
        <p>&copy; 2026 Urdu Typing Master. تمام حقوق محفوظ ہیں۔</p>
    </footer>

    <script>
        // پاس ورڈ اور یوزر نیم کی چیکنگ
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // یہاں ڈیفالٹ یوزر نیم admin اور پاس ورڈ 12345 رکھا ہے
            if (user === 'admin' && pass === '12345') {
                localStorage.setItem('isAdminLoggedIn', 'true');
                window.location.href = 'admin.html';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
